<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lays Gallery - Vote for Your Favorites</title>
  <link rel="stylesheet" href="src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="src/gallery.css" />

</head>

<body>
  <div class="gallery-page">
    <div class="gallery-header">
      <a href="index.html" class="back-btn">← Back to Configurator</a>
      <h1>🥔 Gallery of Flavours</h1>
      <p>Vote for your favorite Lay's creations!</p>
      
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="all">All Bags</button>
        <button class="tab-btn" data-tab="my">My Bags</button>
      </div>
    </div>

    <div id="loading" class="loading">Loading bags...</div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="bags-container" class="bags-grid"></div>
  </div>

  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
